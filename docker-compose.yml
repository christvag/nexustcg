services:
  # TCG Grading App
  tcg-grading-app:
    build: .
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - JWT_SECRET=${JWT_SECRET:-nexus-tcgrading-secret-key-2024}
    env_file:
      - .env.local
    volumes:
      # Mount database directory for SQLite persistence
      - ./database:/app/database
    restart: unless-stopped

  # SQLite Viewer - Population Report (graded-cards.db)
  sqlite-viewer-graded:
    image: coleifer/sqlite-web
    ports:
      - "8081:8080"
    volumes:
      - ./database:/data
    command: ["sqlite_web", "/data/graded-cards.db", "--host", "0.0.0.0", "--port", "8080", "--password"]
    environment:
      - SQLITE_WEB_PASSWORD=Testlocal@1!
    restart: unless-stopped

  # SQLite Viewer - Users & Orders (user-management.db)
  sqlite-viewer-users:
    image: coleifer/sqlite-web
    ports:
      - "8082:8080"
    volumes:
      - ./database:/data
    command: ["sqlite_web", "/data/user-management.db", "--host", "0.0.0.0", "--port", "8080", "--password"]
    environment:
      - SQLITE_WEB_PASSWORD=Testlocal@1!
    restart: unless-stopped
